<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clube do Queijo - Peça na loja mais perto</title>
<meta name="description" content="Encontre a loja Clube do Queijo Pizzaria mais próxima de você e faça seu pedido.">
<style>
  :root{
    --vermelho:#d81f26;
    --vermelho-escuro:#a3161c;
    --amarelo:#f9c22b;
    --amarelo-escuro:#e0a800;
    --massa:#fbe7cf;
    --marrom:#2f2a28;
    --creme:#fff8ef;
    --verde:#25a244;
    --verde-escuro:#1e8438;
    --sombra:0 12px 34px rgba(0,0,0,.20);
    --raio:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    color:var(--marrom);
    background:
      radial-gradient(circle at 50% 0%, #e23b30 0%, transparent 55%),
      linear-gradient(160deg,#d81f26 0%, #a3161c 100%);
    min-height:100dvh;
    padding:20px 14px 44px;
    display:flex;justify-content:center;align-items:flex-start;
  }
  .wrap{width:100%;max-width:500px}
  .card{
    background:var(--creme);border-radius:22px;box-shadow:var(--sombra);overflow:hidden;
  }
  header{
    background:linear-gradient(180deg,#a3161c,#7d1116);
    text-align:center;padding:22px 20px 20px;
  }
  header img{width:132px;height:auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
  header p{color:var(--massa);opacity:.92;font-size:.95rem;margin-top:12px;font-weight:500}
  .conteudo{padding:22px 20px 26px}
  .intro{text-align:center;font-size:1.02rem;color:#5b4636;margin-bottom:20px;line-height:1.5}
  .intro strong{color:var(--vermelho)}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
    border:none;cursor:pointer;font-size:1.06rem;font-weight:800;
    padding:16px;border-radius:var(--raio);transition:transform .08s ease, filter .15s ease;
    text-decoration:none;font-family:inherit;
  }
  .btn:active{transform:scale(.98)}
  .btn-gps{background:var(--vermelho);color:#fff;box-shadow:0 6px 16px rgba(216,31,38,.4)}
  .btn-gps:hover{filter:brightness(1.06)}
  .divisor{display:flex;align-items:center;text-align:center;color:#b39a82;margin:20px 0;
    font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px}
  .divisor::before,.divisor::after{content:"";flex:1;height:2px;background:#eeddc4}
  .divisor span{padding:0 12px}
  .campo-cep{display:flex;gap:10px}
  .campo-cep input{
    flex:1;font-size:1.12rem;padding:15px 16px;border-radius:var(--raio);
    border:2px solid #e9d8bd;background:#fff;color:var(--marrom);outline:none;letter-spacing:1px;
    font-family:inherit;min-width:0;
  }
  .campo-cep input:focus{border-color:var(--vermelho)}
  .btn-cep{background:var(--marrom);color:#fff;width:auto;padding:15px 22px;flex:0 0 auto}
  .btn-cep:hover{filter:brightness(1.15)}
  .status{margin-top:18px;text-align:center;font-size:.95rem;min-height:22px;color:#7a6552}
  .status.erro{color:var(--vermelho-escuro);font-weight:700}
  .resultado{margin-top:20px;display:none}
  .resultado.visivel{display:block;animation:sobe .35s ease}
  @keyframes sobe{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .loja{background:#fff;border:2px solid #f0e2cd;border-radius:var(--raio);padding:18px;
    box-shadow:0 6px 18px rgba(58,36,24,.1)}
  .loja .tag{display:inline-block;background:#e7f8ec;color:var(--verde-escuro);
    font-size:.76rem;font-weight:800;padding:5px 11px;border-radius:999px;margin-bottom:10px;
    text-transform:uppercase;letter-spacing:.5px}
  .loja h2{font-size:1.3rem;margin-bottom:5px;color:var(--vermelho)}
  .loja .endereco{color:#6f5a48;font-size:.95rem;line-height:1.45}
  .loja .distancia{color:var(--marrom);font-weight:800;font-size:.95rem;margin:10px 0 14px}
  .loja .acoes{display:flex;flex-direction:column;gap:10px}
  .btn-pedir{background:var(--verde);color:#fff}
  .btn-pedir:hover{filter:brightness(1.07)}
  .btn-rota{background:#fff;color:var(--marrom);border:2px solid #e9d8bd;font-weight:700;font-size:.98rem}
  .btn-rota:hover{background:#faf3e8}
  .outras{margin-top:16px}
  .outras summary{cursor:pointer;color:#8a7360;font-size:.92rem;font-weight:700;padding:8px 0;list-style:none}
  .outras summary::-webkit-details-marker{display:none}
  .outras summary::before{content:"▾ ";color:var(--vermelho)}
  .outras[open] summary::before{content:"▴ "}
  .outras .mini{display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:12px 14px;border:1px solid #efe2cd;border-radius:12px;margin-top:8px;background:#fff}
  .outras .mini .nome{font-size:.92rem;font-weight:600}
  .outras .mini .km{font-size:.8rem;color:#9a836f;margin-top:2px}
  .outras .mini a{color:#fff;background:var(--verde);font-weight:700;text-decoration:none;
    font-size:.85rem;white-space:nowrap;padding:8px 12px;border-radius:10px}
  footer{text-align:center;font-size:.8rem;color:rgba(255,255,255,.8);margin-top:18px;line-height:1.5}
  footer a{color:#fff;font-weight:700}
  .spinner{width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;
    border-radius:50%;animation:girar .7s linear infinite;display:inline-block;vertical-align:middle}
  @keyframes girar{to{transform:rotate(360deg)}}
  @media (max-width:400px){
    .campo-cep{flex-direction:column}
    .btn-cep{width:100%}
    header img{width:112px}
  }
</style>
</head>

<script>
/* ============================================================
   LOJAS CLUBE DO QUEIJO (Curitiba/PR)
   Coordenadas obtidas a partir do CEP de cada endereco.
   Para ajustar o ponto exato de uma loja: abra o Google Maps,
   clique com o botao direito sobre a loja, copie os dois numeros
   (o 1o e lat, o 2o e lng) e substitua abaixo.
   ============================================================ */
const LOJAS = [
  {
    nome: "Clube do Queijo Portao",
    endereco: "Av. Rep. Argentina, 2593 - Portao, Curitiba/PR",
    lat: -25.4713135, lng: -49.2943287,
    link: "https://pedido.brendi.com.br/pizzaria-clube-do-queijo-portao"
  },
  {
    nome: "Clube do Queijo Cabral",
    endereco: "R. Dr. Manoel Pedro, 715 - Cabral, Curitiba/PR",
    lat: -25.4087767, lng: -49.2532547,
    link: "https://pedido.brendi.com.br/pizzaria-clube-do-queijo-cabral"
  },
  {
    nome: "Clube do Queijo Bigorrilho",
    endereco: "R. Padre Anchieta, 2671 - Lj 2 - Bigorrilho, Curitiba/PR",
    lat: -25.43295, lng: -49.2994,
    link: "https://pedido.brendi.com.br/pizzaria-clube-do-queijo-bigorrilho"
  },
  {
    nome: "Clube do Queijo Fazendinha",
    endereco: "Av. Frederico Lambertucci, 13 - Fazendinha, Curitiba/PR",
    lat: -25.4856234, lng: -49.3287935,
    link: "https://pedido.brendi.com.br/pizzaria-clube-do-queijo-fazendinha"
  },
  {
    nome: "Clube do Queijo Boqueirao",
    endereco: "R. Maestro Carlos Frank, 2370 - Boqueirao, Curitiba/PR",
    lat: -25.5200534, lng: -49.2353157,
    link: "https://pedido.brendi.com.br/pizzaria-clube-do-queijo-boqueirao"
  }
];
/* ============================================================ */

const $ = (id) => document.getElementById(id);
const statusEl = $("status");

function distanciaKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const rad = (g) => g * Math.PI / 180;
  const dLat = rad(lat2 - lat1);
  const dLon = rad(lon2 - lon1);
  const a = Math.sin(dLat/2) ** 2 +
            Math.cos(rad(lat1)) * Math.cos(rad(lat2)) *
            Math.sin(dLon/2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function ordenarPorProximidade(lat, lng) {
  return LOJAS
    .map(l => ({ ...l, dist: distanciaKm(lat, lng, l.lat, l.lng) }))
    .sort((a, b) => a.dist - b.dist);
}

function formatarDistancia(km) {
  if (km < 1) return Math.round(km * 1000) + " m";
  return km.toFixed(1).replace(".", ",") + " km";
}

function mostrarResultado(lista, origem) {
  const maisProxima = lista[0];
  $("lojaNome").textContent = maisProxima.nome;
  $("lojaEndereco").textContent = maisProxima.endereco;
  $("lojaDistancia").textContent = "\u{1F4CD} A cerca de " + formatarDistancia(maisProxima.dist) + " de voce";
  $("lojaPedir").href = maisProxima.link;

  const rota = $("lojaRota");
  const destino = maisProxima.lat + "," + maisProxima.lng;
  rota.href = origem
    ? "https://www.google.com/maps/dir/?api=1&origin=" + origem.lat + "," + origem.lng + "&destination=" + destino
    : "https://www.google.com/maps/search/?api=1&query=" + destino;

  const outrasEl = $("outras");
  const wrap = $("outrasWrap");
  outrasEl.innerHTML = "";
  const restantes = lista.slice(1);
  if (restantes.length) {
    wrap.style.display = "block";
    restantes.forEach(l => {
      const div = document.createElement("div");
      div.className = "mini";
      div.innerHTML =
        '<div><div class="nome">' + l.nome + '</div>' +
        '<div class="km">' + formatarDistancia(l.dist) + ' de voce</div></div>' +
        '<a href="' + l.link + '" target="_blank" rel="noopener">Pedir</a>';
      outrasEl.appendChild(div);
    });
  } else {
    wrap.style.display = "none";
  }

  statusEl.textContent = "";
  statusEl.classList.remove("erro");
  const res = $("resultado");
  res.classList.add("visivel");
  res.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

$("btnGps").addEventListener("click", () => {
  if (!navigator.geolocation) {
    setStatus("Seu navegador nao suporta localizacao. Use o CEP abaixo.", true);
    return;
  }
  const ic = $("gpsIcone");
  if (ic) ic.outerHTML = '<span class="spinner" id="gpsIcone"></span>';
  $("gpsTexto").textContent = "Localizando...";
  setStatus("Buscando sua localizacao...");

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      resetGps();
      const { latitude, longitude } = pos.coords;
      mostrarResultado(ordenarPorProximidade(latitude, longitude), { lat: latitude, lng: longitude });
    },
    (err) => {
      resetGps();
      let msg = "Nao consegui acessar sua localizacao. Tente pelo CEP.";
      if (err.code === 1) msg = "A localizacao esta bloqueada. Libere no navegador ou use o CEP.";
      setStatus(msg, true);
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
});

function resetGps() {
  const ic = $("gpsIcone");
  if (ic) ic.outerHTML = '<span id="gpsIcone">\u{1F4CD}</span>';
  $("gpsTexto").textContent = "Usar minha localizacao";
}

$("cep").addEventListener("input", (e) => {
  let v = e.target.value.replace(/\D/g, "").slice(0, 8);
  if (v.length > 5) v = v.slice(0, 5) + "-" + v.slice(5);
  e.target.value = v;
});

$("formCep").addEventListener("submit", async (e) => {
  e.preventDefault();
  const cep = $("cep").value.replace(/\D/g, "");
  if (cep.length !== 8) {
    setStatus("Digite um CEP valido com 8 numeros.", true);
    return;
  }
  setStatus("Procurando o endereco do CEP...");
  const coords = await cepParaCoordenadas(cep);
  if (!coords) {
    setStatus("Nao achei as coordenadas desse CEP. Tente usar sua localizacao (GPS).", true);
    return;
  }
  mostrarResultado(ordenarPorProximidade(coords.lat, coords.lng), coords);
});

async function cepParaCoordenadas(cep) {
  try {
    const r = await fetch("https://cep.awesomeapi.com.br/json/" + cep);
    if (r.ok) {
      const d = await r.json();
      if (d.lat && d.lng) return { lat: parseFloat(d.lat), lng: parseFloat(d.lng) };
    }
  } catch (_) {}
  try {
    const r = await fetch("https://brasilapi.com.br/api/cep/v2/" + cep);
    if (r.ok) {
      const d = await r.json();
      const c = d.location && d.location.coordinates;
      if (c && c.latitude && c.longitude) return { lat: parseFloat(c.latitude), lng: parseFloat(c.longitude) };
    }
  } catch (_) {}
  return null;
}

function setStatus(msg, erro = false) {
  statusEl.textContent = msg;
  statusEl.classList.toggle("erro", erro);
}
</script>
</body>
</html>
